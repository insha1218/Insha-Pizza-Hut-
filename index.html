<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSHA PIZZA HUT</title>
<style>
body{margin:0;background:#000;color:#FFD700;font-family:Arial;text-align:center}
h1{font-size:34px;margin:10px 0 0;text-shadow:0 0 10px gold}
.wheel-wrap{position:relative;width:94vw;max-width:540px;margin:0 auto}
#wheel{width:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.25,.1,.25,1);display:block;box-shadow:0 0 30px gold}
#arrow{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:42px solid #FFD700;filter:drop-shadow(0 0 8px gold);z-index:20}
button{background:linear-gradient(#FFD700,#B8860B);border:none;padding:14px 40px;border-radius:30px;font-size:21px;font-weight:bold;margin:12px 0;cursor:pointer;box-shadow:0 0 15px gold}
#result{background:linear-gradient(135deg,#1a1a1a,#333);border:2px solid gold;border-radius:14px;padding:14px;margin:12px;min-height:90px}
.code{font-size:32px;font-weight:bold;color:#00FF88;word-break:break-all}
.small{font-size:13px;color:#ccc}
.admin{margin:18px;padding:12px;border:1px dashed gold;text-align:left}
table{width:100%;font-size:11px;color:#fff;border-collapse:collapse}th,td{border:1px solid #555;padding:3px}
</style>
</head>
<body>
<h1>INSHA PIZZA HUT</h1><div>SPIN & WIN UP TO 20% OFF</div>
<div class="wheel-wrap"><div id="arrow"></div><img id="wheel" src="wheel.jpg" alt="wheel"></div>
<button id="spinBtn">SPIN NOW</button>
<div id="result"><div id="msg">ایرو جہاں رکے گا وہی آفر ملے گی</div><div class="code" id="codeBox"></div><div class="small" id="detailBox"></div></div>
<div class="small">Contact 03427529146 • 03354277240<br>باقی: <span id="leftCount"></span> / 100</div>
<div class="admin"><h3 style="text-align:center">ایڈمن لسٹ</h3><button onclick="showList()">لسٹ دیکھیں</button><button onclick="exportCSV()">CSV</button><button onclick="resetAll()" style="background:#900;color:#fff">ری سیٹ</button><div style="max-height:320px;overflow:auto"><table id="listTable"><thead><tr><th>#</th><th>کوڈ</th><th>آفر</th><th>وقت</th></tr></thead><tbody></tbody></table></div></div>
<script>
const LIMITS_ORIG = {'3':25,'5':20,'8':21,'10':15,'13':10,'15':5,'18':3,'20':1};
const ANGLE_MAP = {'3':0,'5':45,'8':90,'10':135,'13':180,'15':225,'18':270,'20':315};
let limits = JSON.parse(localStorage.getItem('insha_limits')||'null') || JSON.parse(JSON.stringify(LIMITS_ORIG));
let winners = JSON.parse(localStorage.getItem('insha_winners')||'[]');
let totalSpins = parseInt(localStorage.getItem('insha_total')||'0');
let currentRotation = 0;
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
function save(){ localStorage.setItem('insha_limits', JSON.stringify(limits)); localStorage.setItem('insha_winners', JSON.stringify(winners)); localStorage.setItem('insha_total', totalSpins); updateLeft(); }
function updateLeft(){ let left = Object.values(limits).reduce((a,b)=>a+b,0); document.getElementById('leftCount').innerText = left; if(left===0){ limits = JSON.parse(JSON.stringify(LIMITS_ORIG)); totalSpins=0; save(); alert('100 مکمل! ری سیٹ'); } }
function pickOffer(){ let available = Object.keys(limits).filter(k=>limits[k]>0); if(available.length===0) return null; let total = available.reduce((s,k)=>s+limits[k],0); let r = Math.random()*total; let acc=0; for(let k of available){ acc+=limits[k]; if(r<=acc) return k; } return available[0]; }
function genCode(p){ let num = Math.floor(1000 + Math.random()*9000); return `INSHA-${p}-${num}`; }
spinBtn.onclick = ()=>{ let offer = pickOffer(); if(!offer){ alert('ختم'); return; } let code = genCode(offer); let targetAngle = 360 - ANGLE_MAP[offer]; let extraSpins = 5 + Math.floor(Math.random()*4); let finalRotation = currentRotation + extraSpins*360 + targetAngle + (Math.random()*14-7); wheel.style.transform = `rotate(${finalRotation}deg)`; currentRotation = finalRotation; spinBtn.disabled=true; document.getElementById('msg').innerText='گھوم رہا ہے...'; setTimeout(()=>{ limits[offer]--; totalSpins++; let rec = {num:totalSpins, code:code, offer:offer+'%', time:new Date().toLocaleString()}; winners.unshift(rec); save(); document.getElementById('msg').innerHTML=`Congratulations You Won <b>${offer}% OFF</b>`; document.getElementById('codeBox').innerText=code; document.getElementById('detailBox').innerHTML=`${offer}% ملا! کوڈ: ${code}`; spinBtn.disabled=false; showList(); },4200); };
function showList(){ const tbody=document.querySelector('#listTable tbody'); tbody.innerHTML=''; winners.forEach((w)=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${w.num}</td><td>${w.code}</td><td>${w.offer}</td><td>${w.time}</td>`; tbody.appendChild(tr); }); }
function exportCSV(){ let csv='Num,Code,Offer,Time\n'; winners.forEach(w=>{ csv+=`${w.num},${w.code},${w.offer},${w.time}\n`; }); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='insha_list.csv'; a.click(); }
function resetAll(){ if(confirm('ری سیٹ؟')){ limits=JSON.parse(JSON.stringify(LIMITS_ORIG)); winners=[]; totalSpins=0; save(); showList(); } }
updateLeft(); showList();
</script></body></html>
