<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSHA PIZZA HUT - Spin & Win</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Arial;text-align:center;color:#fff;min-height:100vh}
.header{background:linear-gradient(90deg,#B91C1C,#FFD700,#B91C1C);padding:16px 10px}
.header h1{color:#fff;font-size:28px;text-shadow:2px 2px 4px #000}
.header .sub{color:#000;font-size:16px;font-weight:bold;margin-top:4px}
.wheel-wrap{position:relative;width:92vw;max-width:500px;margin:20px auto;aspect-ratio:1/1;border-radius:50%;box-shadow:0 0 0 6px #FFD700,0 0 0 10px #000,0 0 0 13px #FFD700,0 0 40px rgba(255,215,0,0.6)}
#wheel{width:100%;height:100%;border-radius:50%;display:block;transition:transform 5s cubic-bezier(0.12,0,0.12,1)}
/* BIG GREEN ARROW - Clear visible */
#arrow{position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:20;width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:60px solid #00FF00;filter:drop-shadow(0 0 12px #00FF00) drop-shadow(0 3px 6px #000)}
.btn{margin:22px auto;background:linear-gradient(90deg,#B91C1C,#FFD700);color:#000;border:3px solid #FFD700;border-radius:50px;padding:16px 48px;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.4);width:86%;max-width:350px}
.btn:disabled{background:#333;color:#888;border-color:#555;cursor:not-allowed}
.result{margin:18px auto;background:#111;border:3px solid #FFD700;border-radius:14px;padding:20px;max-width:500px;width:92%;display:none}
.code{font-size:38px;font-weight:bold;color:#000;background:#FFD700;padding:14px 28px;border-radius:10px;display:inline-block;margin-top:12px;letter-spacing:4px}
.timer{margin:14px auto;color:#00FF00;font-size:14px;font-weight:bold;background:#111;padding:11px 18px;border-radius:20px;border:1px solid #00FF00;display:inline-block;max-width:92%}
.admin-panel{display:none;background:#111;color:#fff;padding:20px;margin:18px auto;max-width:680px;border-radius:12px;border:2px solid #FFD700;text-align:left}
.admin-panel input{padding:11px;width:60%;border-radius:6px;border:1px solid #FFD700;background:#222;color:#fff}
.admin-panel button{padding:11px 14px;margin:4px;border-radius:6px;border:none;background:#B91C1C;color:#FFD700;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>INSHA PIZZA HUT</h1><div class="sub">SPIN & WIN UPTO 20% OFF</div></div>

<div class="wheel-wrap"><div id="arrow"></div><img id="wheel" src="wheel.jpg" alt="wheel"></div>

<button class="btn" id="spinBtn">SPIN NOW</button>

<div class="timer" id="timerBox" style="display:none"></div>

<div class="result" id="resultBox">
<h2 style="color:#FFD700">CONGRATULATIONS!</h2>
<p id="resultText" style="font-size:19px"></p>
<div class="code" id="codeBox"></div>
<p style="margin-top:12px;color:#FFD700;font-size:12px">یہ 4 ہندسوں کا کوڈ کاؤنٹر پر دکھائیں<br>03427529146 • 03354277240</p>
</div>

<div class="admin-panel" id="adminPanel">
<h3 style="color:#FFD700">🔐 ADMIN PANEL</h3>
<p style="font-size:11px;color:#aaa">ایڈمن: سائٹ + #admin</p>
<div style="font-size:11px;margin:8px 0">3%:<b id="a3">0</b>/25 5%:<b id="a5">0</b>/20 8%:<b id="a8">0</b>/21 10%:<b id="a10">0</b>/15 13%:<b id="a13">0</b>/10 15%:<b id="a15">0</b>/5 18%:<b id="a18">0</b>/3 20%:<b id="a20">0</b>/1</div>
<input type="text" id="verifyInput" placeholder="4 ہندسہ مثلا 4729">
<button onclick="verifyCode()">VERIFY</button>
<p id="verifyResult" style="margin-top:8px;font-weight:bold"></p>
<button onclick="resetAll()" style="margin-top:10px;background:#444;color:#fff">RESET ALL</button>
</div>

<script>
const LIMITS={'3':25,'5':20,'8':21,'10':15,'13':10,'15':5,'18':3,'20':1};
const ROTATE={'3':0,'5':45,'8':90,'10':135,'13':180,'15':225,'18':270,'20':315};
let limits=JSON.parse(localStorage.getItem('insha_limits')||'null')||JSON.parse(JSON.stringify(LIMITS));
let currentRot=parseFloat(localStorage.getItem('insha_rotation')||'0');
let lastSpinTime=parseInt(localStorage.getItem('insha_last_time')||'0');
let codesHistory=JSON.parse(localStorage.getItem('insha_codes')||'[]');
const wheel=document.getElementById('wheel');const btn=document.getElementById('spinBtn');const resultBox=document.getElementById('resultBox');const timerBox=document.getElementById('timerBox');
wheel.style.transform=`rotate(${currentRot}deg)`;
function pickOffer(){let a=Object.keys(limits).filter(k=>limits[k]>0);if(!a.length)return null;let s=a.reduce((x,k)=>x+limits[k],0);let r=Math.random()*s;let ac=0;for(let k of a){ac+=limits[k];if(r<=ac)return k;}return a[0];}
function genCode(){return Math.floor(1000+Math.random()*9000).toString();}
function check24h(){if(!lastSpinTime)return true;let d=Date.now()-lastSpinTime;if(d<86400000){btn.disabled=true;btn.innerText='ALREADY SPUN';let lo=localStorage.getItem('insha_last_offer');let lc=localStorage.getItem('insha_last_code');if(lo){resultBox.style.display='block';document.getElementById('resultText').innerText=`You Won ${lo}% OFF!`;document.getElementById('codeBox').innerText=lc;}startCountdown();return false;}return true;}
function startCountdown(){timerBox.style.display='inline-block';function u(){let diff=86400000-(Date.now()-lastSpinTime);if(diff<=0){timerBox.style.display='none';btn.disabled=false;btn.innerText='SPIN NOW';clearInterval(iv);return;}let h=Math.floor(diff/3600000);let m=Math.floor((diff%3600000)/60000);let s=Math.floor((diff%60000)/1000);timerBox.innerText=`⏰ ${h} گھنٹے ${m} منٹ ${s} سیکنڈ بعد دوبارہ سپن ملے گا - 24 گھنٹے میں ایک بار`;}u();let iv=setInterval(u,1000);}
btn.onclick=()=>{if(!check24h())return;let offer=pickOffer();if(!offer){limits=JSON.parse(JSON.stringify(LIMITS));offer=pickOffer();}let code=genCode();let target=ROTATE[offer];let finalRot=currentRot+2160+(360-target)+Math.random()*10;wheel.style.transform=`rotate(${finalRot}deg)`;currentRot=finalRot;btn.disabled=true;btn.innerText='SPINNING...';resultBox.style.display='none';timerBox.style.display='none';setTimeout(()=>{limits[offer]--;lastSpinTime=Date.now();localStorage.setItem('insha_limits',JSON.stringify(limits));localStorage.setItem('insha_rotation',currentRot);localStorage.setItem('insha_last_time',lastSpinTime);localStorage.setItem('insha_last_offer',offer);localStorage.setItem('insha_last_code',code);codesHistory.push({time:Date.now(),offer:offer,code:code});localStorage.setItem('insha_codes',JSON.stringify(codesHistory));resultBox.style.display='block';document.getElementById('resultText').innerText=`You Won ${offer}% OFF!`;document.getElementById('codeBox').innerText=code;btn.innerText='ALREADY SPUN';startCountdown();updateAdmin();},5000);};
function verifyCode(){let i=document.getElementById('verifyInput').value.trim();let f=codesHistory.find(c=>c.code===i);document.getElementById('verifyResult').innerText=f?`✅ درست! ${f.offer}% OFF دینا ہے`:'❌ غلط کوڈ';}
function resetAll(){if(confirm('ری سیٹ کریں؟')){localStorage.clear();location.reload();}}
function updateAdmin(){document.getElementById('a3').innerText=LIMITS['3']-limits['3'];document.getElementById('a5').innerText=LIMITS['5']-limits['5'];document.getElementById('a8').innerText=LIMITS['8']-limits['8'];document.getElementById('a10').innerText=LIMITS['10']-limits['10'];document.getElementById('a13').innerText=LIMITS['13']-limits['13'];document.getElementById('a15').innerText=LIMITS['15']-limits['15'];document.getElementById('a18').innerText=LIMITS['18']-limits['18'];document.getElementById('a20').innerText=LIMITS['20']-limits['20'];}}
if(location.hash==='#admin'){document.getElementById('adminPanel').style.display='block';}
check24h();updateAdmin();
</script>
</body>
</html>
