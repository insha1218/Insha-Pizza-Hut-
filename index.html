<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSHA PIZZA HUT</title>
<style>
body{margin:0;background:#000;color:#FFD700;font-family:Arial;text-align:center}
.wheel-wrap{position:relative;width:94vw;max-width:540px;margin:0 auto}
#wheel{width:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.25,.1,.25,1);display:block;box-shadow:0 0 30px gold}
#arrow{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:42px solid #FFD700;filter:drop-shadow(0 0 8px gold);z-index:20}
button{background:linear-gradient(#FFD700,#B8860B);border:none;padding:14px 40px;border-radius:30px;font-size:21px;font-weight:bold;margin:12px 0;cursor:pointer;box-shadow:0 0 15px gold}
#result{background:linear-gradient(135deg,#1a1a1a,#333);border:2px solid gold;border-radius:14px;padding:14px;margin:12px;min-height:90px}
.code{font-size:32px;font-weight:bold;color:#00FF88;word-break:break-all}
.small{font-size:13px;color:#ccc}
</style>
</head>
<body>
<h1>INSHA PIZZA HUT</h1><div>SPIN & WIN UP TO 20% OFF</div>
<div class="wheel-wrap"><div id="arrow"></div><img id="wheel" src="FINAL_WHEEL_WITH_BIG_ARROW.jpg" alt="wheel"></div>
<button id="spinBtn">SPIN NOW</button>
<div id="result"><div id="msg">ایرو جہاں رکے گا وہی آفر ملے گی</div><div class="code" id="codeBox"></div><div class="small" id="detailBox"></div></div>
<div class="small">Contact 03427529146 • 03354277240<br>باقی: <span id="leftCount"></span> / 100</div>
<script>
const LIMITS_ORIG = {'3':25,'5':20,'8':21,'10':15,'13':10,'15':5,'18':3,'20':1};
const ANGLE_MAP = {'3':0,'5':45,'8':90,'10':135,'13':180,'15':225,'18':270,'20':315};
let limits = JSON.parse(localStorage.getItem('insha_limits')||'null') || JSON.parse(JSON.stringify(LIMITS_ORIG));
let totalSpins = parseInt(localStorage.getItem('insha_total')||'0');
let currentRotation = 0;
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
function save(){ localStorage.setItem('insha_limits', JSON.stringify(limits)); localStorage.setItem('insha_total', totalSpins); updateLeft(); }
function updateLeft(){ let left = Object.values(limits).reduce((a,b)=>a+b,0); document.getElementById('leftCount').innerText = left; if(left===0){ limits = JSON.parse(JSON.stringify(LIMITS_ORIG)); totalSpins=0; save(); alert('100 مکمل! ری سیٹ'); } }
function pickOffer(){ let available = Object.keys(limits).filter(k=>limits[k]>0); if(available.length===0) return null; let total = available.reduce((s,k)=>s+limits[k],0); let r = Math.random()*total; let acc=0; for(let k of available){ acc+=limits[k]; if(r<=acc) return k; } return available[0]; }
function genCode(p){ let num = Math.floor(1000 + Math.random()*9000); return `INSHA-${p}-${num}`; }
spinBtn.onclick = ()=>{ let offer = pickOffer(); if(!offer){ alert('ختم'); return; } let code = genCode(offer); let targetAngle = 360 - ANGLE_MAP[offer]; let extraSpins = 5 + Math.floor(Math.random()*4); let finalRotation = currentRotation + extraSpins*360 + targetAngle + (Math.random()*14-7); wheel.style.transform = `rotate(${finalRotation}deg)`; currentRotation = finalRotation; spinBtn.disabled=true; document.getElementById('msg').innerText='گھوم رہا ہے...'; setTimeout(()=>{ limits[offer]--; totalSpins++; save(); document.getElementById('msg').innerHTML=`Congratulations You Won <b>${offer}% OFF</b>`; document.getElementById('codeBox').innerText=code; document.getElementById('detailBox').innerHTML=`آپ کو ${offer}% ملا! یہ کوڈ دکھائیں`; spinBtn.disabled=false; },4200); };
updateLeft();
</script></body></html>
