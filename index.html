<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSHA PIZZA HUT - Spin & Win</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Arial,sans-serif;text-align:center;color:#fff;min-height:100vh}
.header{background:linear-gradient(90deg,#B91C1C,#FFD700,#B91C1C);padding:15px 10px;box-shadow:0 4px 15px rgba(255,215,0,0.4)}
.header h1{color:#fff;font-size:28px;letter-spacing:1px;text-shadow:2px 2px 4px #000}
.header .sub{color:#000;font-size:16px;font-weight:bold;margin-top:4px}
.wheel-area{padding:18px 0 8px}
.wheel-wrap{position:relative;width:90vw;max-width:480px;margin:0 auto;aspect-ratio:1/1;border-radius:50%;box-shadow:0 0 0 5px #FFD700,0 0 0 9px #000,0 0 0 12px #FFD700,0 0 35px rgba(255,215,0,0.6)}
#wheel{width:100%;height:100%;border-radius:50%;display:block;will-change:transform}
/* GOLDEN ARROW */
#arrow{position:absolute;top:-28px;left:50%;transform:translateX(-50%);z-index:10;width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:62px solid #FFD700;filter:drop-shadow(0 0 12px #FFD700) drop-shadow(0 4px 8px #000)}
#arrow::after{content:'';position:absolute;top:-70px;left:-10px;width:20px;height:20px;background:radial-gradient(circle,#FFF8DC,#FFD700);border:2px solid #B8860B;border-radius:50%;box-shadow:0 0 10px #FFD700}
.btn{margin:20px auto;background:linear-gradient(90deg,#B91C1C,#FFD700);color:#000;border:3px solid #FFD700;border-radius:50px;padding:15px 45px;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.4);width:86%;max-width:350px;display:block}
.btn:disabled{background:#333;color:#888;border-color:#555;cursor:not-allowed}
.result{margin:16px auto;background:linear-gradient(180deg,#1a1a1a,#000);border:3px solid #FFD700;border-radius:14px;padding:20px;max-width:500px;width:92%;display:none;box-shadow:0 0 20px rgba(255,215,0,0.3)}
.code{font-size:40px;font-weight:900;color:#000;background:linear-gradient(180deg,#FFF8DC,#FFD700);padding:14px 30px;border-radius:10px;display:inline-block;margin-top:12px;letter-spacing:5px;box-shadow:0 4px 15px rgba(255,215,0,0.5);border:2px solid #B8860B}
.timer{margin:12px auto;color:#FFD700;font-size:14px;font-weight:bold;background:#111;padding:11px 18px;border-radius:20px;border:1px solid #FFD700;display:none;max-width:92%}
.admin{display:none;background:#111;color:#fff;padding:18px;margin:18px auto;max-width:680px;border-radius:12px;border:2px solid #FFD700;text-align:left}
.admin input{padding:10px;width:60%;border-radius:6px;border:1px solid #FFD700;background:#222;color:#fff}
.admin button{padding:10px 14px;margin:4px;border-radius:6px;border:none;background:#B91C1C;color:#FFD700;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>INSHA PIZZA HUT</h1><div class="sub">SPIN & WIN UPTO 20% OFF</div></div>
<div class="wheel-area"><div class="wheel-wrap"><div id="arrow"></div><img id="wheel" src="wheel.jpg" alt="wheel"></div></div>
<button class="btn" id="spinBtn" type="button">SPIN NOW</button>
<div class="timer" id="timerBox"></div>
<div class="result" id="resultBox"><h2 style="color:#FFD700">CONGRATULATIONS!</h2><p id="resultText" style="font-size:19px"></p><div class="code" id="codeBox"></div><p style="margin-top:10px;color:#FFD700;font-size:12px">یہ 4 ہندسوں کا کوڈ کاؤنٹر پر دکھائیں<br>03427529146 • 03354277240</p></div>
<div class="admin" id="adminPanel"><h3 style="color:#FFD700">🔐 ADMIN PANEL</h3><p style="font-size:11px;color:#aaa">ایڈمن: سائٹ + #admin</p><div style="font-size:11px;margin:8px 0">3%:<span id="a3">0</span>/25 5%:<span id="a5">0</span>/20 8%:<span id="a8">0</span>/21 10%:<span id="a10">0</span>/15 13%:<span id="a13">0</span>/10 15%:<span id="a15">0</span>/5 18%:<span id="a18">0</span>/3 20%:<span id="a20">0</span>/1</div><input type="text" id="verifyInput" placeholder="4 ہندسہ مثلا 4729"><button type="button" onclick="verifyCode()">VERIFY</button><p id="verifyResult" style="margin-top:8px;font-weight:bold"></p><button type="button" onclick="resetAll()" style="margin-top:12px;background:#444;color:#fff">RESET ALL 100</button></div>
<script>
var LIMITS_ORIG = { '3':25,'5':20,'8':21,'10':15,'13':10,'15':5,'18':3,'20':1 };
var ROTATE_MAP = { '3':0,'5':45,'8':90,'10':135,'13':180,'15':225,'18':270,'20':315 };
var limits, currentRot, lastSpinTime, codesHistory;
try{limits=JSON.parse(localStorage.getItem('insha_limits'));if(!limits)limits=JSON.parse(JSON.stringify(LIMITS_ORIG));}catch(e){limits=JSON.parse(JSON.stringify(LIMITS_ORIG));}
currentRot=parseInt(localStorage.getItem('insha_rotation')||'0');if(isNaN(currentRot))currentRot=0;
lastSpinTime=parseInt(localStorage.getItem('insha_last_time')||'0');if(isNaN(lastSpinTime))lastSpinTime=0;
try{codesHistory=JSON.parse(localStorage.getItem('insha_codes')||'[]');}catch(e){codesHistory=[];}
var wheel=document.getElementById('wheel');var btn=document.getElementById('spinBtn');var resultBox=document.getElementById('resultBox');var timerBox=document.getElementById('timerBox');
wheel.style.transform='rotate('+currentRot+'deg)';
function saveAll(){localStorage.setItem('insha_limits',JSON.stringify(limits));localStorage.setItem('insha_rotation',currentRot);localStorage.setItem('insha_codes',JSON.stringify(codesHistory));updateAdmin();}
function updateAdmin(){var el=function(id){return document.getElementById(id);};if(!el('a3'))return;el('a3').innerText=LIMITS_ORIG['3']-limits['3'];el('a5').innerText=LIMITS_ORIG['5']-limits['5'];el('a8').innerText=LIMITS_ORIG['8']-limits['8'];el('a10').innerText=LIMITS_ORIG['10']-limits['10'];el('a13').innerText=LIMITS_ORIG['13']-limits['13'];el('a15').innerText=LIMITS_ORIG['15']-limits['15'];el('a18').innerText=LIMITS_ORIG['18']-limits['18'];el('a20').innerText=LIMITS_ORIG['20']-limits['20'];}
function pickOffer(){var avail=[];for(var k in limits){if(limits[k]>0)avail.push(k);}if(avail.length===0)return null;var sum=0;for(var i=0;i<avail.length;i++)sum+=limits[avail[i]];var r=Math.random()*sum;var acc=0;for(var i=0;i<avail.length;i++){acc+=limits[avail[i]];if(r<=acc)return avail[i];}return avail[0];}
function genCode(){return String(Math.floor(1000+Math.random()*9000));}
function check24h(){if(!lastSpinTime)return true;var diff=Date.now()-lastSpinTime;if(diff<86400000){btn.disabled=true;btn.innerText='ALREADY SPUN';resultBox.style.display='block';var lastOffer=localStorage.getItem('insha_last_offer');var lastCode=localStorage.getItem('insha_last_code');if(lastOffer){document.getElementById('resultText').innerText='You Won '+lastOffer+'% OFF!';document.getElementById('codeBox').innerText=lastCode;}startCountdown();return false;}return true;}
function startCountdown(){timerBox.style.display='inline-block';function update(){var diff=86400000-(Date.now()-lastSpinTime);if(diff<=0){timerBox.style.display='none';btn.disabled=false;btn.innerText='SPIN NOW';clearInterval(timerInterval);return;}var h=Math.floor(diff/3600000);var m=Math.floor((diff%3600000)/60000);var s=Math.floor((diff%60000)/1000);timerBox.innerText='⏰ '+h+' گھنٹے '+m+' منٹ '+s+' سیکنڈ بعد دوبارہ سپن ملے گا - 24 گھنٹے میں ایک بار';}update();var timerInterval=setInterval(update,1000);}
btn.addEventListener('click',function(){if(!check24h())return;var offer=pickOffer();if(!offer){limits=JSON.parse(JSON.stringify(LIMITS_ORIG));offer=pickOffer();}var code=genCode();var targetDeg=ROTATE_MAP[offer];var extraSpins=7+Math.floor(Math.random()*3);var finalRot=currentRot+extraSpins*360+(360-targetDeg)+(Math.random()*10-5);wheel.style.transition='transform 5s cubic-bezier(0.12,0,0.12,1)';wheel.style.transform='rotate('+finalRot+'deg)';currentRot=finalRot;btn.disabled=true;btn.innerText='SPINNING...';resultBox.style.display='none';timerBox.style.display='none';setTimeout(function(){limits[offer]--;lastSpinTime=Date.now();localStorage.setItem('insha_limits',JSON.stringify(limits));localStorage.setItem('insha_rotation',currentRot);localStorage.setItem('insha_last_time',lastSpinTime);localStorage.setItem('insha_last_offer',offer);localStorage.setItem('insha_last_code',code);codesHistory.push({time:Date.now(),offer:offer,code:code,used:false});localStorage.setItem('insha_codes',JSON.stringify(codesHistory));resultBox.style.display='block';document.getElementById('resultText').innerText='You Won '+offer+'% OFF!';document.getElementById('codeBox').innerText=code;btn.innerText='ALREADY SPUN';saveAll();startCountdown();},5100);});
function verifyCode(){var input=document.getElementById('verifyInput').value.trim();var found=null;for(var i=0;i<codesHistory.length;i++){if(codesHistory[i].code===input){found=codesHistory[i];break;}}var res=document.getElementById('verifyResult');if(!found){res.innerText='❌ غلط کوڈ';res.style.color='red';return;}if(found.used){res.innerText='⚠️ پہلے استعمال ہو چکا - '+found.offer+'% OFF';res.style.color='orange';return;}found.used=true;localStorage.setItem('insha_codes',JSON.stringify(codesHistory));res.innerText='✅ درست! '+found.offer+'% OFF دینا ہے - کوڈ: '+found.code;res.style.color='lightgreen';}
function resetAll(){if(confirm('100 آفرز ری سیٹ کرنی ہیں؟')){localStorage.clear();location.reload();}}
if(window.location.hash==='#admin'){document.getElementById('adminPanel').style.display='block';}
check24h();updateAdmin();
</script>
</body>
</html>
